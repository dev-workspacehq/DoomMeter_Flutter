name: doom_meter
description: "A feature-first Flutter MVVM starter."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  auto_route: ^11.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  injectable_generator: ^3.0.2
  auto_route_generator: ^10.6.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
